services:
  backend:
    build: .
    container_name: projet_stayEase1
    working_dir: /var/www/html/StayEase
    expose:
      - 9000
    volumes:
      - ".:/var/www/html"
    networks:
      - stay_sase_network   

  phpmyadmin:
    image: phpmyadmin
    container_name: phpmyadmin_stayEase
    restart: always
    ports:
      - 8089:80
    environment:
      - PMA_ARBITRARY=0
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root123
      - PMA_ABSOLUTE_URI=http://localhost:8089/
    networks:
      - stay_sase_network

  nginx:
    image: nginx:latest
    container_name: nginx1
    ports:
      - "8080:80"
    volumes:
      - ".:/var/www/html" 
      - "./nginx.conf:/etc/nginx/nginx.conf"     
    depends_on:
      - backend  
    networks:
      - stay_sase_network  

  db:
    image: mysql:latest   
    container_name: mysql_container1
    environment:
       MYSQL_ROOT_PASSWORD: "root123"
       MYSQL_DATABASE: "StayEase"
    volumes:
      - mydata:/var/lib/mysql
    ports:
      - 3306:3306     
    networks:
      - stay_sase_network

volumes:
  mydata:

networks:
  stay_sase_network:
    driver: bridge